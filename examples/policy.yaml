# Registry Gate policy.
#
# Mount this file into the proxy and admin containers and point POLICY_FILE
# at it (e.g. POLICY_FILE=/etc/registry-gate/policy.yaml).
#
# Version 1 groups policy by package ecosystem. Package names inside each
# ecosystem are ecosystem-local and may use '*' globs, similar to Dependabot.
# `allow` is evaluated before the other settings in the same ecosystem.

version: 1

ecosystems:
  - package-ecosystem: npm
    allow:
      - "@company/*"
    deny:
      - example-malicious-pkg
    cooldown:
      default-days: 7
      include:
        - "*"
      exclude:
        - "@company/*"
    trust-downgrade:
      watch:
        - provenance.present
        - publisher.type
        - publisher.two_factor
      on-unknown: warn

  - package-ecosystem: pypi
    cooldown:
      default-days: 7
      include:
        - "*"

  - package-ecosystem: rubygems
    cooldown:
      default-days: 7
      include:
        - "*"
    trust-downgrade:
      watch:
        - publisher.two_factor
      on-unknown: warn

  - package-ecosystem: composer
    deny:
      - acme/bad-package
    cooldown:
      default-days: 7
      include:
        - "*"

  - package-ecosystem: maven
    cooldown:
      default-days: 7
      include:
        - "*"

  - package-ecosystem: nuget
    cooldown:
      default-days: 7
      include:
        - "*"

  - package-ecosystem: cargo
    cooldown:
      default-days: 7
      include:
        - "*"

  - package-ecosystem: gomod
    cooldown:
      default-days: 7
      include:
        - "*"

  # Popularity — block packages with very low download counts.
  # Useful for preventing typosquatting or obscure packages.
  # - package-ecosystem: npm
  #   min-downloads:
  #     threshold: 1000
  #     include:
  #       - "*"
