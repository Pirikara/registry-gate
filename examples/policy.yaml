# Registory Gate policy.
#
# Mount this file into the proxy and admin containers and point POLICY_FILE
# at it (e.g. POLICY_FILE=/etc/registory-gate/policy.yaml).
#
# Rules are evaluated top-to-bottom. The first matching `allow` rule short-
# circuits and lets the package through. Otherwise, every matching rule is
# evaluated; if any of them blocks, the request is denied.
#
# Each entry has exactly one rule kind as its top-level key.

version: 1

rules:
  # ----------------------------------------------------------------- #
  # 1. Allow — bypass the rest of the policy for trusted packages.
  #    Put these first so they short-circuit other rules.
  # ----------------------------------------------------------------- #
  - allow: []

  # ----------------------------------------------------------------- #
  # 2. Deny — explicit blocklist (e.g. for incidents).
  # ----------------------------------------------------------------- #
  - deny: [npm:example-malicious-pkg]

  # ----------------------------------------------------------------- #
  # 3. Cooldown — block freshly published versions.
  # ----------------------------------------------------------------- #
  - cooldown:
      min_age_days: 7
      ecosystems: [npm, pypi, rubygems]

  # ----------------------------------------------------------------- #
  # 4. Trust downgrade — block versions whose trust signals regressed
  #    relative to recent baseline versions.
  #    Scope to ecosystems where the signal is actually available
  #    (see README "Trust signal availability per ecosystem").
  # ----------------------------------------------------------------- #
  - trust_downgrade:
      ecosystems: [npm, pypi, rubygems]
      watch:
        - provenance.present
        - publisher.type
        - publisher.two_factor
      on_unknown: warn
