services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    ports:
      - "8080:8080"
    volumes:
      - db-data:/data
      - ./examples/policy.yaml:/policy.yaml:ro
    environment:
      POLICY_FILE: /policy.yaml
      DATABASE_URL: "file:/data/downloads.db"
      PROXY_NPM_BASE_URL: "http://localhost:8080"
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    ports:
      - "8081:8081"
    volumes:
      - db-data:/data
      - ./examples/policy.yaml:/policy.yaml:ro
    environment:
      POLICY_FILE: /policy.yaml
      DATABASE_URL: "file:/data/downloads.db"
    depends_on:
      - proxy
    restart: unless-stopped

volumes:
  db-data:
